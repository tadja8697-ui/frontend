<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Galerie d'images en CSS Grid - Layout responsive.">
    <meta name="author" content="TADJA DA RAOULYNE DUMONDE">

    <meta property="og:title" content="Image Grid Layout">
    <meta property="og:description" content="Une galerie d'images en CSS Grid.">
    <meta property="og:type" content="website">

    <title>Image Grid Layout</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <h1>Image Grid</h1>

        <!-- ========== LA GRILLE ========== -->
        <section class="grid" aria-label="Galerie d'images">

            <figure class="grid-item item-a">
                <img
                    src="https://picsum.photos/seed/foggy-beach/800/1200"
                    alt="Une plage brumeuse avec une grande formation rocheuse au premier plan"
                >
            </figure>

            <figure class="grid-item item-b">
                <img
                    src="https://picsum.photos/seed/white-living-room/800/600"
                    alt="Un salon blanc avec un canapé et une fenêtre ronde"
                >
            </figure>

            <figure class="grid-item item-c">
                <img
                    src="https://picsum.photos/seed/food-table/800/600"
                    alt="Une table garnie d'assiettes et de bols de nourriture"
                >
            </figure>

            <figure class="grid-item item-d">
                <img
                    src="https://picsum.photos/seed/red-door/800/1200"
                    alt="Un bâtiment avec une porte rouge et un arbre devant"
                >
            </figure>

            <figure class="grid-item item-e">
                <img
                    src="https://picsum.photos/seed/white-buildings/800/1200"
                    alt="Une rangée d'immeubles blancs le long d'une rue"
                >
            </figure>

            <figure class="grid-item item-f">
                <img
                    src="https://picsum.photos/seed/beach-hill/800/600"
                    alt="Vue d'une plage depuis le sommet d'une colline"
                >
            </figure>

        </section>
    </main>

</body>
</html>
