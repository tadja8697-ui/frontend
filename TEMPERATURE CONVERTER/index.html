<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Temperature Converter - Convert between Celsius, Fahrenheit and Kelvin.">
    <meta name="author" content="Your Name">

    <title>Temperature Converter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <section class="converter-card">

            <header class="converter-header">
                <h1>Temperature Converter</h1>
                <p>Enter the temperature, select units and submit</p>
            </header>

            <!-- ========== FORMULAIRE ========== -->
            <form class="converter-form" id="converter-form" novalidate>

                <!-- Champ température -->
                <label for="temperature" class="sr-only">
                    Temperature value
                </label>
                <input
                    type="number"
                    id="temperature"
                    class="field field--number"
                    placeholder="0.00"
                    step="any"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-required="true"
                >

                <!-- Select From -->
                <label for="from-unit" class="sr-only">
                    From unit
                </label>
                <select
                    id="from-unit"
                    class="field field--select"
                    aria-required="true"
                >
                    <option value="" selected disabled>From Unit</option>
                    <option value="fahrenheit">Fahrenheit</option>
                    <option value="celsius">Celsius</option>
                    <option value="kelvin">Kelvin</option>
                </select>

                <!-- Select To -->
                <label for="to-unit" class="sr-only">
                    To unit
                </label>
                <select
                    id="to-unit"
                    class="field field--select"
                    aria-required="true"
                >
                    <option value="" selected disabled>To Unit</option>
                    <option value="fahrenheit">Fahrenheit</option>
                    <option value="celsius">Celsius</option>
                    <option value="kelvin">Kelvin</option>
                </select>

                <!-- Bouton Convert -->
                <button
                    type="submit"
                    id="convert-btn"
                    class="field field--button"
                    disabled
                >
                    Convert
                </button>

            </form>

            <!-- ========== RÉSULTAT ========== -->
            <p
                class="result"
                id="result"
                aria-live="polite"
                aria-atomic="true"
            ></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
