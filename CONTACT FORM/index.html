<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact MyBlog team. Send us a message, question or feedback.">
    <meta name="author" content="MyBlog">

    <title>Contact Us - MyBlog</title>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header>
        <a href="/"><strong>MyBlog</strong></a>

        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/blog">Blog</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ========== MAIN ========== -->
    <main>

        <h1>Contact Us</h1>

        <p>Have a question or feedback? Fill in the form below and we'll get back to you.</p>

        <!-- ========== FORMULAIRE ========== -->
        <form
            action="https://example.com/contact"
            method="post"
        >

            <!-- ---------- CHAMP : Full name ---------- -->
            <p>
                <label for="full-name">Full name</label><br>
                <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    autocomplete="name"
                    required
                    minlength="2"
                    maxlength="100"
                >
            </p>

            <!-- ---------- CHAMP : Email ---------- -->
            <p>
                <label for="email">Email</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    placeholder="you@example.com"
                >
            </p>

            <!-- ---------- CHAMP : Subject (select) ---------- -->
            <p>
                <label for="subject">Subject</label><br>
                <select id="subject" name="subject" required>
                    <option value="">-- Please choose an option --</option>
                    <option value="general">General inquiry</option>
                    <option value="support">Technical support</option>
                    <option value="feedback">Feedback</option>
                    <option value="partnership">Partnership</option>
                </select>
            </p>

            <!-- ---------- CHAMP : Message (textarea) ---------- -->
            <p>
                <label for="message">Message</label><br>
                <textarea
                    id="message"
                    name="message"
                    rows="8"
                    cols="50"
                    minlength="20"
                    maxlength="1000"
                    required
                ></textarea>
            </p>

            <!-- ---------- GROUPE : How did you hear about us? ---------- -->
            <fieldset>
                <legend>How did you hear about us?</legend>

                <p>
                    <input
                        type="radio"
                        id="source-search"
                        name="source"
                        value="search"
                        required
                    >
                    <label for="source-search">Search engine</label>
                </p>

                <p>
                    <input
                        type="radio"
                        id="source-social"
                        name="source"
                        value="social"
                    >
                    <label for="source-social">Social media</label>
                </p>

                <p>
                    <input
                        type="radio"
                        id="source-friend"
                        name="source"
                        value="friend"
                    >
                    <label for="source-friend">Friend or colleague</label>
                </p>

                <p>
                    <input
                        type="radio"
                        id="source-other"
                        name="source"
                        value="other"
                    >
                    <label for="source-other">Other</label>
                </p>
            </fieldset>

            <!-- ---------- CHAMP : Newsletter (checkbox) ---------- -->
            <p>
                <input
                    type="checkbox"
                    id="newsletter"
                    name="newsletter"
                    value="yes"
                >
                <label for="newsletter">
                    Subscribe to our monthly newsletter
                </label>
            </p>

            <!-- ---------- BOUTON SUBMIT ---------- -->
            <p>
                <button type="submit">Send message</button>
            </p>

        </form>

    </main>

    <!-- ========== FOOTER ========== -->
    <footer>
        <p>© 2026 MyBlog. All rights reserved.</p>
    </footer>

</body>
</html>
