<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Task Tracker - A simple to-do list application.">
    <meta name="author" content="Your Name">

    <title>Task Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <h1>Task Tracker</h1>

        <!-- ========== FORMULAIRE D'AJOUT ========== -->
        <form class="task-form" id="task-form">
            <label for="task-input" class="sr-only">
                Nouvelle tâche
            </label>

            <input
                type="text"
                id="task-input"
                class="task-input"
                placeholder="Start writing and press enter to create task"
                autocomplete="off"
                aria-label="Description de la nouvelle tâche"
            >

            <button
                type="submit"
                class="task-submit"
                aria-label="Ajouter la tâche"
            >
                <!-- Icône "Entrée" (↵) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <polyline points="9 10 4 15 9 20"></polyline>
                    <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
                </svg>
            </button>
        </form>

        <!-- ========== LISTE DES TÂCHES ========== -->
        <ul
            class="task-list"
            id="task-list"
            aria-live="polite"
            aria-label="Liste des tâches"
        >
            <!-- Les <li> seront injectés par JavaScript -->
        </ul>

    </main>

    <script src="script.js"></script>

</body>
</html>
