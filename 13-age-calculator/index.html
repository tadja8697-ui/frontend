<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Calculateur d'âge précis avec Luxon.">
    <meta name="author" content="Your Name">

    <meta property="og:title" content="Age Calculator">
    <meta property="og:description" content="Calculez votre âge exact en années, mois et jours.">
    <meta property="og:type" content="website">

    <title>Age Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Flatpickr CSS (pour le datepicker) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <h1>Age Calculator</h1>

        <form class="age-form" id="age-form" novalidate>

            <label for="birthdate" class="form-label">
                Enter your birth date:
            </label>

            <!-- ⚠️ On utilise type="text" et non "date" → Flatpickr prend le relais -->
            <div class="input-wrapper">
                <input
                    type="text"
                    id="birthdate"
                    name="birthdate"
                    class="form-input"
                    placeholder="DD/MM/YYYY"
                    autocomplete="bday"
                    aria-required="true"
                    aria-describedby="error-message"
                >
            </div>

            <p id="error-message" class="error-message" role="alert" hidden></p>

            <button type="submit" class="submit-btn">Calculate</button>

        </form>

        <!-- Résultat -->
        <p class="result" id="result" aria-live="polite"></p>

    </main>

    <script type="module" src="/main.js"></script>

</body>
</html>
